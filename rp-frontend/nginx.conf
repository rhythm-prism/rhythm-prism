# Serves the built SPA. API/Sonolus traffic is routed by the top-level
# reverse proxy (../nginx.conf); this container only serves static assets.
server {
    listen 5000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
