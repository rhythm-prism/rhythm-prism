services:
  rp-frontend:
    build:
      context: ./rp-frontend
      args:
        VITE_DISCORD_SERVER_URL: ${DISCORD_SERVER_URL:-}
    restart: always
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5000/"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  rp-backend:
    build: ./rp-backend
    env_file:
      - .env
    restart: always
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17
    restart: always
    shm_size: "256mb"
    ports:
      - "5002:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  rp-level-converter:
    build: ./rp-level-converter
    restart: always
    ports:
      - "5003:5003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - "5004:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  celery-worker:
    build: ./rp-backend
    env_file:
      - .env
    command: uv run celery -A celery_app worker --loglevel=warning --concurrency=6 --max-tasks-per-child=100 --soft-time-limit=95
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  postgres_data:
  redis_data: