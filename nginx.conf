events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;

    # Discord等のリンク展開ボット判定。該当する場合はOGP埋め込み用のHTMLをrp-backendから返す。
    map $http_user_agent $is_link_preview_bot {
        default 0;
        "~*(discordbot|twitterbot|slackbot|telegrambot|facebookexternalhit|line-poker|whatsapp|vkshare|redditbot|linkedinbot|embedly|skypeuripreview)" 1;
    }

    # WebSocketアップグレード時のみConnection: upgradeを送り、それ以外はkeepalive用に空にする
    # (upstreamへの接続を使い回してTCPハンドシェイク分のレイテンシを削減するため)。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    upstream backend_api {
        server rp-backend:5001;
        keepalive 32;
    }

    upstream backend_default {
        server rp-frontend:5000;
        keepalive 32;
    }

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300;

        location ~ ^/(api|sonolus) {
            proxy_pass http://backend_api;
        }

        location / {
            # bot判定時のみ/api/ogp系にURIを書き換えて、上の location にそのまま処理させる。
            # 人間のアクセスはmapの参照(安価なUA正規表現1回)以外、既存のコードパスと変わらない。
            if ($is_link_preview_bot) {
                rewrite ^/$ /api/ogp last;
                rewrite ^/chart/([A-Za-z0-9_-]+)/?$ /api/ogp/chart/$1 last;
            }
            proxy_pass http://backend_default;
        }
    }
}
